<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Economy: Ledger with income/expense bars -->
  <rect x="6" y="6" width="52" height="52" rx="4"/>
  <line x1="6" y1="20" x2="58" y2="20"/>
  <text x="14" y="16" font-size="10" fill="currentColor">Cash</text>
  <text x="50" y="16" font-size="10" fill="currentColor" text-anchor="end">€1,240</text>
  <!-- Income/Expense bars -->
  <rect x="14" y="26" width="36" height="10" rx="2" fill="#4CAF50" fill-opacity="0.3"/>
  <text x="16" y="33" font-size="9" fill="#4CAF50">Income: €420</text>
  <rect x="14" y="38" width="24" height="10" rx="2" fill="#F44336" fill-opacity="0.3"/>
  <text x="16" y="45" font-size="9" fill="#F44336">Expense: €280</text>
  <!-- Net -->
  <line x1="14" y1="50" x2="50" y2="50" stroke-width="1.5" opacity="0.3"/>
  <text x="14" y="58" font-size="10" fill="currentColor">Net: +€140/week</text>
  <!-- Reputation stars -->
  <polygon points="48,26 49,30 53,30 49,32 51,36 48,33 45,36 47,32 43,30 47,30" fill="currentColor" fill-opacity="0.4"/>
  <polygon points="52,26 53,30 57,30 53,32 55,36 52,33 49,36 51,32 47,30 51,30" fill="currentColor" fill-opacity="0.4"/>
  <polygon points="56,26 57,30 61,30 57,32 59,36 56,33 53,36 55,32 51,30 55,30" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>