<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Resources: Storage with goods -->
  <rect x="10" y="14" width="44" height="40" rx="4"/>
  <line x1="10" y1="28" x2="54" y2="28" stroke-width="1.5" opacity="0.3"/>
  <line x1="10" y1="42" x2="54" y2="42" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="14" x2="32" y2="54" stroke-width="1.5" opacity="0.3"/>
  <!-- Feed -->
  <circle cx="20" cy="22" r="6" fill="currentColor" fill-opacity="0.2"/>
  <path d="M17 20 L23 20 M17 24 L21 24" stroke-width="1.5"/>
  <text x="20" y="31" text-anchor="middle" font-size="8" fill="currentColor">Feed</text>
  <text x="20" y="38" text-anchor="middle" font-size="9" fill="currentColor" font-weight="bold">240 kg</text>
  <!-- Timber -->
  <rect x="38" y="18" width="12" height="8" rx="1" fill="currentColor" fill-opacity="0.2"/>
  <line x1="40" y1="18" x2="40" y2="26" stroke-width="1.5"/>
  <line x1="44" y1="18" x2="44" y2="26" stroke-width="1.5"/>
  <text x="44" y="31" text-anchor="middle" font-size="8" fill="currentColor">Timber</text>
  <text x="44" y="38" text-anchor="middle" font-size="9" fill="currentColor" font-weight="bold">18 kg</text>
  <!-- Stone -->
  <circle cx="20" cy="48" r="6" fill="currentColor" fill-opacity="0.2"/>
  <path d="M16 48 L24 48 M17 45 L23 51" stroke-width="1.5" opacity="0.5"/>
  <text x="20" y="57" text-anchor="middle" font-size="8" fill="currentColor">Stone</text>
  <text x="20" y="62" text-anchor="middle" font-size="9" fill="currentColor" font-weight="bold">12 kg</text>
  <!-- Capacity bar -->
  <rect x="36" y="46" width="18" height="6" rx="2" fill="currentColor" fill-opacity="0.15" stroke-width="1.5" fill="none"/>
  <rect x="36" y="46" width="10" height="6" rx="2" fill="currentColor" fill-opacity="0.4"/>
  <text x="45" y="44" font-size="7" fill="currentColor">40/80 kg</text>
</svg>