<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Expeditions: Map with region markers and path -->
  <rect x="6" y="6" width="52" height="52" rx="4"/>
  <!-- Regions -->
  <circle cx="20" cy="16" r="6" fill="currentColor" fill-opacity="0.2"/>
  <text x="20" y="19" text-anchor="middle" font-size="8" fill="currentColor">V</text>
  <circle cx="44" cy="16" r="6" stroke-width="1.5"/>
  <text x="44" y="19" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.5">R</text>
  <circle cx="50" cy="40" r="6" stroke-width="1.5"/>
  <text x="50" y="43" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.5">Q</text>
  <circle cx="20" cy="48" r="6" stroke-width="1.5"/>
  <text x="20" y="51" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.5">M</text>
  <circle cx="14" cy="34" r="6" stroke-width="1.5"/>
  <text x="14" y="37" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.5">W</text>
  <circle cx="38" cy="34" r="6" stroke-width="1.5"/>
  <text x="38" y="37" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.5">O</text>
  <circle cx="32" cy="32" r="6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="32" y="35" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.5">H</text>
  <!-- Path between visited -->
  <path d="M20 16 L32 32 L44 16" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M20 48 L32 32 L50 40" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="currentColor"/></marker></defs>
  <!-- Profession badge -->
  <rect x="44" y="48" width="16" height="12" rx="2" fill="currentColor" fill-opacity="0.15"/>
  <text x="52" y="56" text-anchor="middle" font-size="7" fill="currentColor">Pro</text>
</svg>