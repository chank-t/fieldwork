<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Options: Gear with settings toggles -->
  <circle cx="32" cy="32" r="18" fill="currentColor" fill-opacity="0.1"/>
  <circle cx="32" cy="32" r="18"/>
  <circle cx="32" cy="32" r="8" fill="currentColor" fill-opacity="0.15"/>
  <!-- Gear teeth -->
  <g stroke-width="2">
    <line x1="32" y1="14" x2="32" y2="18"/>
    <line x1="32" y1="46" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="18" y2="32"/>
    <line x1="46" y1="32" x2="50" y2="32"/>
    <line x1="20" y1="20" x2="23" y2="23"/>
    <line x1="41" y1="41" x2="44" y2="44"/>
    <line x1="20" y1="44" x2="23" y2="41"/>
    <line x1="41" y1="23" x2="44" y2="20"/>
  </g>
  <!-- Settings list -->
  <rect x="6" y="6" width="18" height="10" rx="2" fill="currentColor" fill-opacity="0.2"/>
  <text x="15" y="13" font-size="7" fill="currentColor">Language</text>
  <rect x="6" y="18" width="18" height="10" rx="2" fill="currentColor" fill-opacity="0.15"/>
  <text x="15" y="25" font-size="7" fill="currentColor">Display</text>
  <rect x="6" y="30" width="18" height="10" rx="2" fill="currentColor" fill-opacity="0.15"/>
  <text x="15" y="37" font-size="7" fill="currentColor">Audio</text>
  <rect x="6" y="42" width="18" height="10" rx="2" fill="currentColor" fill-opacity="0.15"/>
  <text x="15" y="49" font-size="7" fill="currentColor">Saves</text>
  <rect x="6" y="54" width="18" height="10" rx="2" fill="currentColor" fill-opacity="0.15"/>
  <text x="15" y="61" font-size="7" fill="currentColor">Access.</text>
  <!-- Toggle switches on right -->
  <rect x="44" y="10" width="14" height="8" rx="4" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="54" cy="14" r="4" fill="currentColor"/>
  <rect x="44" y="22" width="14" height="8" rx="4" fill="currentColor" fill-opacity="0.15" stroke-width="1.5" fill="none"/>
  <circle cx="46" cy="26" r="4" fill="currentColor" fill-opacity="0.3"/>
  <rect x="44" y="34" width="14" height="8" rx="4" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="54" cy="38" r="4" fill="currentColor"/>
  <rect x="44" y="46" width="14" height="8" rx="4" fill="currentColor" fill-opacity="0.15" stroke-width="1.5" fill="none"/>
  <circle cx="46" cy="50" r="4" fill="currentColor" fill-opacity="0.3"/>
  <rect x="44" y="58" width="14" height="8" rx="4" fill="currentColor" fill-opacity="0.4"/>
  <circle cx="54" cy="62" r="4" fill="currentColor"/>
</svg>