<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Market panel: Price board with goods -->
  <rect x="6" y="6" width="52" height="52" rx="4"/>
  <line x1="6" y1="20" x2="58" y2="20"/>
  <text x="14" y="16" font-size="10" fill="currentColor">Wheat</text>
  <text x="14" y="16" font-size="10" fill="currentColor" x="40" text-anchor="end">€2.40</text>
  <line x1="6" y1="32" x2="58" y2="32" stroke-dasharray="3 3"/>
  <text x="14" y="28" font-size="10" fill="currentColor">Milk</text>
  <text x="14" y="28" font-size="10" fill="currentColor" x="40" text-anchor="end">€1.80</text>
  <line x1="6" y1="44" x2="58" y2="44" stroke-dasharray="3 3"/>
  <text x="14" y="40" font-size="10" fill="currentColor">Eggs</text>
  <text x="14" y="40" font-size="10" fill="currentColor" x="40" text-anchor="end">€3.20</text>
  <text x="14" y="52" font-size="10" fill="currentColor">Cheese</text>
  <text x="14" y="52" font-size="10" fill="currentColor" x="40" text-anchor="end">€5.60</text>
  <!-- Trend arrows -->
  <path d="M50 16 L54 12 L58 16" stroke-width="2" fill="currentColor" fill-opacity="0.3" stroke="#4CAF50"/>
  <path d="M50 28 L54 32 L58 28" stroke-width="2" stroke="#F44336"/>
  <path d="M50 40 L54 36 L58 40" stroke-width="2" fill="currentColor" fill-opacity="0.3" stroke="#4CAF50"/>
  <path d="M50 52 L54 48 L58 52" stroke-width="2" fill="currentColor" fill-opacity="0.3" stroke="#4CAF50"/>
</svg>