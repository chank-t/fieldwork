<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Character: Avatar with XP bar and talent stars -->
  <circle cx="32" cy="20" r="10"/>
  <ellipse cx="32" cy="46" rx="14" ry="16"/>
  <!-- XP bar -->
  <rect x="10" y="52" width="44" height="6" rx="2" fill="currentColor" fill-opacity="0.15" stroke-width="1.5" fill="none"/>
  <rect x="10" y="52" width="26" height="6" rx="2" fill="currentColor" fill-opacity="0.4"/>
  <text x="32" y="50" text-anchor="middle" font-size="8" fill="currentColor">XP: 180/220</text>
  <!-- Level -->
  <circle cx="48" cy="16" r="8" fill="currentColor" fill-opacity="0.2"/>
  <text x="48" y="19" text-anchor="middle" font-size="10" fill="currentColor" font-weight="bold">5</text>
  <!-- Talent stars -->
  <polygon points="32,8 33,12 37,12 33,14 35,18 32,16 29,18 31,14 27,12 31,12" fill="currentColor" fill-opacity="0.5"/>
  <polygon points="20,12 21,16 25,16 21,18 23,22 20,20 17,22 19,18 17,16 21,16" fill="currentColor" fill-opacity="0.3"/>
  <polygon points="44,12 45,16 49,16 45,18 47,22 44,20 41,22 43,18 41,16 45,16" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Course book -->
  <rect x="6" y="10" width="10" height="12" rx="1" stroke-width="1.5" fill="currentColor" fill-opacity="0.15"/>
  <line x1="8" y1="14" x2="14" y2="14" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="18" x2="14" y2="18" stroke-width="1" opacity="0.5"/>
</svg>