<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Machinery: Four machines -->
  <!-- Cultivator -->
  <rect x="6" y="36" width="16" height="8" rx="1" fill="currentColor" fill-opacity="0.15"/>
  <circle cx="8" cy="44" r="4" stroke-width="2"/>
  <circle cx="18" cy="44" r="4" stroke-width="2"/>
  <line x1="12" y1="44" x2="8" y2="44" stroke-width="2"/>
  <path d="M8 40 L6 36 L10 36" stroke-width="2"/>
  <!-- Pump -->
  <rect x="26" y="34" width="8" height="12" rx="1"/>
  <circle cx="30" cy="34" r="5" stroke-width="2"/>
  <path d="M30 29 L30 24 L26 22 L34 22" stroke-width="2"/>
  <path d="M28 38 L32 38" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="30" y1="46" x2="30" y2="52" stroke-width="2"/>
  <path d="M28 52 L32 52" stroke-width="2"/>
  <!-- Harvester -->
  <rect x="42" y="36" width="18" height="8" rx="1" fill="currentColor" fill-opacity="0.15"/>
  <circle cx="44" cy="44" r="4" stroke-width="2"/>
  <circle cx="56" cy="44" r="4" stroke-width="2"/>
  <path d="M46 36 L44 32 L50 32" stroke-width="2"/>
  <path d="M56 36 L58 32 L52 32" stroke-width="2"/>
  <!-- Mixer -->
  <ellipse cx="14" cy="18" rx="8" ry="5" stroke-width="2"/>
  <path d="M14 13 L14 8" stroke-width="2"/>
  <circle cx="14" cy="8" r="3" fill="currentColor" fill-opacity="0.2"/>
  <path d="M6 18 Q14 10 22 18" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M14 23 Q14 28 14 23" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Condition bars -->
  <rect x="4" y="4" width="20" height="3" rx="1" fill="currentColor" fill-opacity="0.3"/>
  <rect x="4" y="4" width="16" height="3" rx="1" stroke-width="1" fill="none"/>
  <rect x="24" y="4" width="20" height="3" rx="1" fill="currentColor" fill-opacity="0.3"/>
  <rect x="24" y="4" width="18" height="3" rx="1" stroke-width="1" fill="none"/>
  <rect x="44" y="4" width="20" height="3" rx="1" fill="currentColor" fill-opacity="0.3"/>
  <rect x="44" y="4" width="12" height="3" rx="1" stroke-width="1" fill="none"/>
</svg>