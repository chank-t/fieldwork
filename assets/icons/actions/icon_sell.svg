<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sell: Arrow going out with coins -->
  <path d="M10 32 L54 32" stroke-width="3" stroke-dasharray="8 4" opacity="0.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="currentColor"/></marker></defs>
  <!-- Item going out -->
  <rect x="14" y="22" width="18" height="12" rx="2" fill="currentColor" fill-opacity="0.2" stroke-width="2"/>
  <text x="23" y="30" text-anchor="middle" font-size="10" fill="currentColor">Wheat</text>
  <path d="M23 22 L23 18 L27 14" stroke-width="2.5"/>
  <path d="M23 34 L23 38 L27 42" stroke-width="2.5"/>
  <!-- Coins coming in -->
  <circle cx="48" cy="24" r="7" fill="currentColor" fill-opacity="0.3"/>
  <text x="48" y="27" text-anchor="middle" font-size="10" fill="currentColor" font-weight="bold">€</text>
  <circle cx="40" cy="40" r="5" fill="currentColor" fill-opacity="0.2"/>
  <text x="40" y="43" text-anchor="middle" font-size="8" fill="currentColor">€</text>
  <circle cx="56" cy="40" r="5" fill="currentColor" fill-opacity="0.2"/>
  <text x="56" y="43" text-anchor="middle" font-size="8" fill="currentColor">€</text>
  <!-- Price tag -->
  <path d="M34 6 L42 6 L46 10 L42 14 L34 14 L30 10 Z" fill="currentColor" fill-opacity="0.2" stroke-width="2"/>
  <text x="38" y="13" text-anchor="middle" font-size="10" fill="currentColor">€4.80</text>
</svg>