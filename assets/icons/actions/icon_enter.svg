<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Enter: Door opening -->
  <rect x="14" y="12" width="36" height="44" rx="4" fill="currentColor" fill-opacity="0.1"/>
  <path d="M14 12 L50 12 L50 56 L14 56 Z" stroke-width="3"/>
  <!-- Door slightly open -->
  <path d="M42 14 L42 54" stroke-width="4"/>
  <path d="M42 14 L30 18" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M42 54 L30 50" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- Interior visible -->
  <rect x="20" y="22" width="16" height="24" rx="2" fill="currentColor" fill-opacity="0.15"/>
  <path d="M28 22 L28 46" stroke-width="2" opacity="0.5"/>
  <circle cx="28" cy="34" r="4" fill="currentColor" fill-opacity="0.3"/>
  <!-- Arrow pointing in -->
  <path d="M54 32 L46 32" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="currentColor"/></marker></defs>
  <!-- Level badge -->
  <circle cx="52" cy="16" r="8" fill="currentColor" fill-opacity="0.2"/>
  <text x="52" y="19" text-anchor="middle" font-size="10" fill="currentColor" font-weight="bold">Lv.3</text>
</svg>