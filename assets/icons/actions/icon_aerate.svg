<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Aerate: Cultivator tines breaking soil -->
  <line x1="8" y1="52" x2="56" y2="52" stroke-width="6" stroke="#8B7355"/>  <!-- compacted soil -->
  <!-- Tines penetrating -->
  <g stroke="#5D8A6B" stroke-width="3">
    <line x1="14" y1="30" x2="14" y2="50"/>
    <line x1="22" y1="28" x2="22" y2="50"/>
    <line x1="30" y1="30" x2="30" y2="50"/>
    <line x1="38" y1="28" x2="38" y2="50"/>
    <line x1="46" y1="30" x2="46" y2="50"/>
    <line x1="54" y1="28" x2="54" y2="50"/>
  </g>
  <!-- Cultivator frame -->
  <path d="M10 26 L58 26" stroke-width="4" stroke="#8B7355"/>
  <line x1="14" y1="26" x2="14" y2="22" stroke-width="3"/>
  <line x1="22" y1="26" x2="22" y2="20" stroke-width="3"/>
  <line x1="30" y1="26" x2="30" y2="22" stroke-width="3"/>
  <line x1="38" y1="26" x2="38" y2="20" stroke-width="3"/>
  <line x1="46" y1="26" x2="46" y2="22" stroke-width="3"/>
  <line x1="54" y1="26" x2="54" y2="20" stroke-width="3"/>
  <!-- Wheels -->
  <circle cx="14" cy="16" r="5" stroke-width="2.5"/>
  <circle cx="54" cy="16" r="5" stroke-width="2.5"/>
  <!-- Compaction meter -->
  <rect x="6" y="6" width="20" height="8" rx="2" fill="currentColor" fill-opacity="0.15" stroke-width="1.5"/>
  <rect x="6" y="6" width="16" height="8" rx="2" fill="#F44336" fill-opacity="0.4"/>
  <text x="16" y="11" font-size="7" fill="currentColor">Compacted</text>
  <path d="M12 16 L16 12" stroke-width="2" stroke="#4CAF50"/>
</svg>