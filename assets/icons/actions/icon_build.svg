<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Build: Hammer on foundation -->
  <rect x="12" y="36" width="40" height="20" rx="2" fill="currentColor" fill-opacity="0.15" stroke-width="2" stroke="#8B7355"/>  <!-- foundation -->
  <line x1="12" y1="44" x2="52" y2="44" stroke-width="1.5" opacity="0.5" stroke="#8B7355"/>
  <line x1="22" y1="36" x2="22" y2="56" stroke-width="1.5" opacity="0.5" stroke="#8B7355"/>
  <line x1="32" y1="36" x2="32" y2="56" stroke-width="1.5" opacity="0.5" stroke="#8B7355"/>
  <line x1="42" y1="36" x2="42" y2="56" stroke-width="1.5" opacity="0.5" stroke="#8B7355"/>
  <!-- Hammer striking -->
  <rect x="30" y="18" width="8" height="12" rx="1" fill="#D4A574" fill-opacity="0.3" stroke-width="2"/>
  <path d="M34 18 L34 12" stroke-width="4" stroke="#8B7355"/>
  <circle cx="34" cy="12" r="4" fill="#D4A574" fill-opacity="0.4"/>
  <!-- Impact lines -->
  <path d="M30 30 L34 30" stroke-width="2.5" stroke="#F44336"/>
  <path d="M34 26 L38 30" stroke-width="2" stroke="#F44336" opacity="0.7"/>
  <path d="M38 26 L42 30" stroke-width="1.5" stroke="#F44336" opacity="0.5"/>
  <!-- Building ghost -->
  <path d="M18 36 L18 16 Q26 8 38 8 Q50 8 50 16 L50 36" stroke-width="2" stroke-dasharray="4 4" opacity="0.4" fill="currentColor" fill-opacity="0.05"/>
  <rect x="24" y="22" width="8" height="8" rx="1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <rect x="38" y="22" width="8" height="8" rx="1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <!-- Cost -->
  <rect x="6" y="6" width="20" height="10" rx="2" fill="currentColor" fill-opacity="0.2"/>
  <text x="16" y="13" font-size="7" fill="currentColor">€1,240</text>
</svg>