<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vet: Medical cross with syringe -->
  <!-- Medical bag -->
  <rect x="14" y="20" width="36" height="28" rx="4" fill="currentColor" fill-opacity="0.15"/>
  <path d="M14 32 L50 32" stroke-width="2" opacity="0.3"/>
  <line x1="32" y1="20" x2="32" y2="48" stroke-width="2" opacity="0.3"/>
  <!-- Cross -->
  <rect x="26" y="26" width="12" height="4" rx="1" fill="currentColor" fill-opacity="0.4"/>
  <rect x="30" y1="22" width="4" height="12" rx="1" fill="currentColor" fill-opacity="0.4"/>
  <!-- Syringe -->
  <rect x="38" y="36" width="8" height="16" rx="1" fill="currentColor" fill-opacity"0.15"/>
  <path d="M42 36 L42 28" stroke-width="3"/>
  <path d="M38 32 L46 32" stroke-width="2"/>
  <circle cx="42" cy="28" r="3" fill="currentColor" fill-opacity="0.5"/>
  <path d="M42 28 L42 22" stroke-width="2"/>
  <!-- Animal with shield -->
  <ellipse cx="16" cy="50" rx="8" ry="5" stroke-width="2" opacity="0.4"/>
  <path d="M16 42 L16 36 L10 32 L16 28" stroke-width="2" stroke="#4CAF50"/>
  <path d="M16 28 L22 32 L16 36" stroke-width="2" stroke="#4CAF50"/>
  <circle cx="16" cy="48" r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="20" cy="48" r="1.5" fill="currentColor" opacity="0.5"/>
  <!-- Health boost -->
  <text x="50" y="16" font-size="10" fill="#4CAF50" font-weight="bold">+25%</text>
</svg>